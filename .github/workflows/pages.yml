name: Verify and deploy Shadow Gym
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    name: Python training checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/requirements.txt
      - run: python -m pip install -r python/requirements.txt
      - run: python -m unittest discover -s python/tests -v
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:docs
      - run: npm run check:capabilities
      - run: npm run prepare:workflows -- --output runs/workflow-examples-ci
      - uses: actions/upload-artifact@v4
        with:
          name: workflow-example-receipt
          path: runs/workflow-examples-ci/receipt.json
          if-no-files-found: error
      - run: npm run test:release
      - run: npm run test:core-wasm
      - run: npm run test:step-import
      - run: node scripts/fetch-test-data.mjs
      - run: npm run test:parity
      - run: npx playwright install --with-deps chromium
      - run: npm run test:geometry-browser
      - run: npm run test:module3-workflow
      - run: npm run build:release
      - run: npm run test:industrial-cancellation
      - run: npm run test:industrial-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: industrial-learning-browser-evidence
          path: test-results/industrial-learning/
          if-no-files-found: warn
      - run: npm run test:browser
      - run: npm run test:run-details
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-details-browser-evidence
          path: test-results/run-details-*/
          if-no-files-found: warn
      - run: npm run test:transitions
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transition-browser-evidence
          path: test-results/transitions-*/
          if-no-files-found: warn
      - run: npm run test:journal-transitions
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journal-transition-browser-evidence
          path: test-results/journal-transitions-*/
          if-no-files-found: warn
      - run: npm run test:prepared-transitions
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prepared-transition-browser-evidence
          path: test-results/prepared-transitions-*/
          if-no-files-found: warn
      - run: npm run test:mill-turn-transitions
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mill-turn-transition-browser-evidence
          path: test-results/mill-turn-transitions-*/
          if-no-files-found: warn
      - run: npm run test:cylindrical-transitions
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cylindrical-transition-browser-evidence
          path: test-results/cylindrical-transitions-*/
          if-no-files-found: warn
      - run: npm run test:step-upload
      - run: npm run test:brep-browser
      - run: npm run test:spherical-bands
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spherical-band-browser-evidence
          path: test-results/spherical-bands-*/
          if-no-files-found: warn
      - run: npm run build:release -- --out dist-second
      - run: diff -rq dist dist-second
      - uses: actions/upload-artifact@v4
        with:
          name: verified-production-build
          path: dist/
          include-hidden-files: true
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [verify, python]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/deploy-pages@v4
        id: deployment
