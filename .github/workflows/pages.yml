name: Verify and deploy Shadow Gym
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:release
      - run: npm run test:core-wasm
      - run: npm run test:step-import
      - run: node scripts/fetch-test-data.mjs
      - run: npm run test:parity
      - run: npx playwright install --with-deps chromium
      - run: npm run build:release
      - run: npm run test:browser
      - run: npm run test:step-upload
      - run: npm run test:brep-browser
      - run: npm run build:release -- --out dist-second
      - run: diff -rq dist dist-second
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/deploy-pages@v4
        id: deployment
